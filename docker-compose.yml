services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: andromeda
      POSTGRES_USER: andromeda
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-andromeda_local_only}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U andromeda -d andromeda"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build: .
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+asyncpg://andromeda:${POSTGRES_PASSWORD:-andromeda_local_only}@postgres:5432/andromeda
      API_DOCS_ENABLED: "true"
      CORS_ORIGINS: http://localhost:3000,http://localhost:8000
    depends_on:
      postgres:
        condition: service_healthy
    command: ["sh", "-c", "alembic upgrade head && uvicorn andromeda_core.main:app --host 0.0.0.0 --port 8000"]
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  postgres_data:
