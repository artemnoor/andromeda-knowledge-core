[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[project]
name = "andromeda-knowledge-core"
version = "0.1.0"
description = "Semantic, provenance-aware educational knowledge core for Andromeda"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Andromeda" }]
dependencies = [
  "alembic==1.14.0",
  "asyncpg==0.30.0",
  "fastapi==0.141.1",
  "prometheus-client==0.22.1",
  "pydantic==2.10.6",
  "pydantic-settings==2.7.1",
  "sqlalchemy==2.0.36",
  "aiosqlite==0.20.0",
  "uvicorn[standard]==0.34.0",
]

[project.optional-dependencies]
dev = [
  "hypothesis==6.125.1",
  "httpx==0.28.1",
  "mypy==1.20.2",
  "pytest==8.3.4",
  "pytest-asyncio==0.25.3",
  "ruff==0.16.5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]
ignore = ["B008", "E501"]

[tool.ruff.lint.isort]
known-first-party = ["andromeda_core"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
warn_untyped_fields = true
